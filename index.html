<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No SIM Chat & Call</title>
  <!-- PeerJS WebRTC Library for Calling -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #e5ddd5; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; height: 100vh; background: #fff; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    
    /* Header */
    .header { background: #075e54; color: white; padding: 15px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .my-id-badge { font-size: 11px; background: #128c7e; padding: 4px 8px; border-radius: 12px; }

    /* Tabs (WhatsApp Style) */
    .tabs { display: flex; background: #075e54; }
    .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #b2d8d8; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    .tab-btn.active { color: white; border-bottom: 3px solid #25d366; }

    /* List Content */
    .tab-content { flex: 1; overflow-y: auto; background: #fff; }
    .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .chat-item:hover { background-color: #f5f5f5; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; background: #25d366; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 12px; }
    .group-avatar { background: #34b7f1; }
    .chat-info h4 { font-size: 15px; color: #111; }
    .chat-info p { font-size: 12px; color: #777; margin-top: 3px; }

    /* Call Action Bar */
    .call-bar { padding: 10px 15px; background: #f0f2f5; display: flex; gap: 8px; border-bottom: 1px solid #ddd; }
    .call-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; outline: none; }
    .call-bar button { padding: 8px 16px; background: #25d366; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* Fullscreen Calling Screen Overlay */
    #callScreen { display: none; position: fixed; inset: 0; background: #111b21; z-index: 9999; flex-direction: column; align-items: center; justify-content: space-around; color: white; }
    .call-user-avatar { width: 100px; height: 100px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
    .end-call-btn { width: 65px; height: 65px; border-radius: 50%; background: #ea0038; border: none; color: white; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top App Header -->
  <div class="header">
    <span>WhatsApp Style Chat</span>
    <span class="my-id-badge" id="myPeerId">Connecting...</span>
  </div>

  <!-- Tabs: Direct Chats vs Groups -->
  <div class="tabs">
    <button class="tab-btn active" id="tabChats" onclick="openTab('chats')">CHATS (1-ON-1)</button>
    <button class="tab-btn" id="tabGroups" onclick="openTab('groups')">GROUPS</button>
  </div>

  <!-- Direct Call Input Bar -->
  <div class="call-bar">
    <input type="text" id="targetPeerId" placeholder="Friend ki ID daalein...">
    <button onclick="startVoiceCall()">Call 📞</button>
  </div>

  <!-- Direct Chats View -->
  <div id="chatsView" class="tab-content">
    <div class="chat-item">
      <div class="avatar">👤</div>
      <div class="chat-info">
        <h4>Personal Chat (Friend 1)</h4>
        <p>Single chat conversation yahan aayegi</p>
      </div>
    </div>
  </div>

  <!-- Groups View -->
  <div id="groupsView" class="tab-content" style="display: none;">
    <div class="chat-item">
      <div class="avatar group-avatar">👥</div>
      <div class="chat-info">
        <h4>Family / Friends Group</h4>
        <p>Group message conversation yahan aayegi</p>
      </div>
    </div>
  </div>
</div>

<!-- CALL CUTTING POPUP SCREEN (End Call Button) -->
<div id="callScreen">
  <div style="text-align: center;">
    <div class="call-user-avatar">📞</div>
    <h2 id="callingUserText">Call Chalu Hai...</h2>
    <p style="color: #8696a0; margin-top: 5px;" id="callTimer">Connected</p>
  </div>

  <!-- Lal Rang Ka Call Cut Button -->
  <button class="end-call-btn" onclick="hangUpCall()" title="Call Cut Karein">
    ✖
  </button>
</div>

<!-- Audio Element to Play Friend's Voice -->
<audio id="remoteAudio" autoplay></audio>

<script>
  let peer = null;
  let activeCall = null;
  let localStream = null;

  // 1. Peer ID create karna
  peer = new Peer();

  peer.on('open', (id) => {
    document.getElementById('myPeerId').innerText = "Aapki ID: " + id;
  });

  // 2. Incoming Call Aane par
  peer.on('call', (call) => {
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      localStream = stream;
      call.answer(stream); // Call pick karna
      activeCall = call;
      showCallScreen("Call Pick Ho Gayi");

      call.on('stream', (remoteStream) => {
        document.getElementById('remoteAudio').srcObject = remoteStream;
      });

      call.on('close', () => {
        closeCallUI();
      });
    }).catch(err => {
      alert("Mic permission allow karein!");
    });
  });

  // 3. Call Lagana
  function startVoiceCall() {
    const friendId = document.getElementById('targetPeerId').value.trim();
    if (!friendId) {
      alert("Pehle dost ki ID enter karein!");
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      localStream = stream;
      showCallScreen("Calling: " + friendId);

      const call = peer.call(friendId, stream);
      activeCall = call;

      call.on('stream', (remoteStream) => {
        document.getElementById('remoteAudio').srcObject = remoteStream;
      });

      call.on('close', () => {
        closeCallUI();
      });
    }).catch(err => {
      alert("Mic permission allow karein!");
    });
  }

  // 4. CALL CUT KARNA (End Call Function)
  function hangUpCall() {
    if (activeCall) {
      activeCall.close(); // Call disconnect
    }
    closeCallUI();
  }

  function closeCallUI() {
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop()); // Mic band karna
      localStream = null;
    }
    document.getElementById('callScreen').style.display = 'none';
  }

  function showCallScreen(title) {
    document.getElementById('callingUserText').innerText = title;
    document.getElementById('callScreen').style.display = 'flex';
  }

  // 5. WhatsApp Style Tab Switch (Single vs Group)
  function openTab(tabName) {
    const chatsView = document.getElementById('chatsView');
    const groupsView = document.getElementById('groupsView');
    const tabChats = document.getElementById('tabChats');
    const tabGroups = document.getElementById('tabGroups');

    if (tabName === 'chats') {
      chatsView.style.display = 'block';
      groupsView.style.display = 'none';
      tabChats.classList.add('active');
      tabGroups.classList.remove('active');
    } else {
      chatsView.style.display = 'none';
      groupsView.style.display = 'block';
      tabGroups.classList.add('active');
      tabChats.classList.remove('active');
    }
  }
</script>
</body>
</html>
